[package]
name = "awpr-photo"
description = "Photo library side of AwayPhotoRawEditor: RAW_TEMP caches, rawpipe.xml, EXIF, decoding"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awpr-core = { path = "../core" }
rayon = "1.10"
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "rayon"] }
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
epaint_default_fonts = "0.36"
trash = "5"

# HEIC through the system decoders (no libheif / libde265 compiled in): libheif is
# loaded at run time on Linux, WIC on Windows, ImageIO on macOS (plain FFI).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging"] }
